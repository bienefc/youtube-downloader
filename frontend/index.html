<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <button id="theme-toggle" class="icon-btn theme-toggle-fixed" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="app">
    <main>
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/>
            <path d="M7 11l5 5 5-5"/>
            <path d="M4 19h16"/>
          </svg>
        </div>
        <h1>YouTube Downloader</h1>
        <p class="tagline">Paste a link, pick a quality, get your file.</p>
      </div>

      <div class="card">
        <div class="input-row">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.49-1.5"/>
            </svg>
            <input id="url-input" type="text" placeholder="Paste a YouTube video URL..." />
          </div>
          <button id="fetch-btn" class="primary-btn">
            <span class="btn-label">Fetch</span>
          </button>
        </div>

        <p id="error-msg" class="error" hidden></p>

        <section id="video-card" class="video-card" hidden>
          <img id="video-thumb" alt="Video thumbnail" />
          <div class="video-meta">
            <h2 id="video-title"></h2>
            <div class="meta-row">
              <p id="video-uploader" class="muted"></p>
              <p id="video-duration" class="muted"></p>
            </div>

            <div class="download-row">
              <select id="quality-select">
                <option value="best">Best quality</option>
                <option value="2160p">2160p (4K)</option>
                <option value="1440p">1440p</option>
                <option value="1080p">1080p</option>
                <option value="720p">720p</option>
                <option value="480p">480p</option>
                <option value="audio">Audio only (MP3)</option>
              </select>
              <button id="download-btn" class="primary-btn">
                <span class="btn-label">Download</span>
              </button>
            </div>

            <p id="status-msg" class="muted" hidden></p>
          </div>
        </section>
      </div>

      <p class="footnote">Downloads are processed locally and never stored on a server.</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
