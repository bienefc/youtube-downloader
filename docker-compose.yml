services:
  yt-downloader:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend/cookies.txt:/app/backend/cookies.txt:ro
    environment:
      - BGUTIL_POT_BASE_URL=http://bgutil-provider:4416
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
